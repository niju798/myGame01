<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#080b16">
    <meta name="description" content="Neon Survivor — a glowing arcade survival game.">
    <title>Neon Survivor</title>
    <link rel="stylesheet" href="style.css">
    <script src="game.js?v=20261118-zoom-settings" defer></script>
  </head>
  <body>
    <main>
      <canvas id="game" aria-label="Neon Survivor game. Use WASD or the joystick to move, and skill buttons to attack.">
        Your browser does not support HTML canvas.
      </canvas>
      <button id="fullscreen-toggle" class="fullscreen-toggle" type="button"
        aria-label="Enter fullscreen" aria-pressed="false" title="Enter fullscreen">
        <svg class="enter-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/>
        </svg>
        <svg class="exit-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3v3a2 2 0 0 1-2 2H3m13-5v3a2 2 0 0 0 2 2h3M3 16h3a2 2 0 0 1 2 2v3m13-5h-3a2 2 0 0 0-2 2v3"/>
        </svg>
      </button>
      <p id="announcement" class="sr-only" aria-live="polite"></p>
    </main>
  </body>
</html>
